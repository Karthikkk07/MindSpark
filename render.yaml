services:
  - type: web
    name: mindspark-api
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      # Generated by Render and kept private.
      - key: JWT_SECRET
        generateValue: true
      # Entered once in the Render dashboard, never stored in the repository.
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
